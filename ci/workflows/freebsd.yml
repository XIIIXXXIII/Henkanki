name: FreeBSD CLI smoke
on: { workflow_dispatch: {}, push: { paths: ["apps/cli/**", "packages/**", "packaging/freebsd/**"] } }
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: pkg install -y node20 npm-node20
          run: |
            node --version
            npm install --ignore-scripts
            node --test tests/text-conversions.test.mjs
            node apps/cli/henkanki.mjs plan json yaml --json
